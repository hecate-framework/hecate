# The contract rendered (OQ-135): the application, a reverse proxy so that the viewer and the application share one
# origin (no CORS needed), and Swagger UI reading /openapi.json. Every image is pinned by tag; pin digests for a
# release. Guide: website/user/en/how-to/render-the-contract-with-docker-compose.md
#
#   docker compose -f docker/compose/compose.yaml up --build
#   http://localhost:8080/docs/   the viewer
#   http://localhost:8080/        the application
services:
  app:
    # Your own application: a Dockerfile `FROM hecate/runtime` that copies it (see the guide). The application must
    # listen on 0.0.0.0 inside the container and be told it is in development, so that it serves /openapi.json.
    build: .
    environment:
      HECATE_ENV: development
    expose:
      - "8080"
    stop_grace_period: 15s

  viewer:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      BASE_URL: /docs
      URL: /openapi.json
    expose:
      - "8080"

  proxy:
    image: nginx:1.27.3-alpine
    ports:
      # Loopback only: /openapi.json is served because the application runs in development; do not publish it.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - viewer
