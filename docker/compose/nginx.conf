# One origin for the application and the viewer: the browser fetches /openapi.json from the same origin as /docs/.
server {
  listen 80;
  server_tokens off;
  client_max_body_size 1m;

  location /docs/ {
    proxy_pass http://viewer:8080;
  }

  location / {
    proxy_pass http://app:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}
