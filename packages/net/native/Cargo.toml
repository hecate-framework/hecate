[package]
name = "hecate-net-tls"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "TLS sessions for hecate.net: rustls (sans-IO) bound to Lua 5.5 through mlua (ADR 0021)"

[lib]
name = "hecate_net_tls_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
mlua = { version = "0.12", features = ["lua55", "module"] }
rustls-platform-verifier = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = true
overflow-checks = true
strip = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
