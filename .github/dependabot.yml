version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Rust crates of the native modules (ADR 0021): new versions and security fixes, one weekly pull
  # request. The lockfile is committed and CI builds with --locked, so an update is a reviewed change.
  - package-ecosystem: cargo
    directory: "/packages/net/native"
    schedule:
      interval: weekly
    groups:
      rust-crates:
        patterns: ["*"]
