name: spike-oq8

# Temporary: measures how connections spread over worker processes per listening strategy on the
# three platforms (OQ-8, docs/spikes/OQ-8-multi-process.md). Runs only when the spike changes.
# Remove it once the strategies are validated and covered by the benchmark harness.
on:
  pull_request:
    paths:
      - "docs/spikes/OQ-8/**"
      - ".github/workflows/spike-oq8.yml"

permissions:
  contents: read

concurrency:
  group: spike-oq8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spike:
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap (Linux, macOS)
        if: steps.toolchain.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap (Windows)
        if: steps.toolchain.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: tools/bootstrap/bootstrap.ps1

      - name: Add toolchain to PATH
        shell: pwsh
        run: |
          $tc = Join-Path $env:GITHUB_WORKSPACE '.hecate/toolchain'
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $tc 'bin')
          if ($env:RUNNER_OS -eq 'Windows') {
            Add-Content -Path $env:GITHUB_ENV -Value "LUAROCKS_CONFIG=$(Join-Path $tc 'luarocks-config.lua')"
          }

      - name: Install luv
        shell: bash
        run: luarocks --tree .hecate/rocks install luv

      - name: SO_REUSEPORT module (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: docs/spikes/OQ-8
        run: |
          flags=""
          if [ "$RUNNER_OS" = "macOS" ]; then flags="-undefined dynamic_lookup"; fi
          cc -O2 -shared -fPIC $flags -I"$GITHUB_WORKSPACE/.hecate/toolchain/include" -o rp.so rp.c

      - name: Spread of connections (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          for mode in reuseport shared round_robin; do
            for run in 1 2; do
              timeout 120 lua docs/spikes/OQ-8/spike.lua "$mode" 4 4000 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
            done
          done

      - name: Spread of connections (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($mode in 'shared', 'round_robin') {
            foreach ($run in 1, 2) {
              lua docs/spikes/OQ-8/spike.lua $mode 4 4000 2>&1 | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
