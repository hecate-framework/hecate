name: spike-oq2
# Temporary: verifies LuaRocks on Lua 5.5 on three platforms (OQ-2). Delete with the spike.
on:
  pull_request:
    paths: ['.github/workflows/spike-oq2.yml']
  workflow_dispatch:

jobs:
  luarocks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build Lua 5.5.1
        shell: bash
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tgz
          tar xzf lua.tgz
          cat > lua-5.5.1/CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.15)
          project(lua C)
          file(GLOB SRC src/*.c)
          list(REMOVE_ITEM SRC ${CMAKE_SOURCE_DIR}/src/lua.c ${CMAKE_SOURCE_DIR}/src/luac.c)
          add_library(lua5 SHARED ${SRC})
          if(WIN32)
            target_compile_definitions(lua5 PRIVATE LUA_BUILD_AS_DLL)
          else()
            target_compile_definitions(lua5 PRIVATE LUA_USE_POSIX LUA_USE_DLOPEN)
            target_link_libraries(lua5 m ${CMAKE_DL_LIBS})
          endif()
          add_executable(lua src/lua.c)
          target_link_libraries(lua lua5)
          install(TARGETS lua lua5 RUNTIME DESTINATION bin LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)
          install(FILES src/lua.h src/luaconf.h src/lualib.h src/lauxlib.h src/lua.hpp DESTINATION include)
          CM
          cmake -S lua-5.5.1 -B lua-build -DCMAKE_INSTALL_PREFIX="$PWD/lua-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build lua-build --config Release
          cmake --install lua-build --config Release
      - name: Install LuaRocks 3.13.0 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://luarocks.org/releases/luarocks-3.13.0.tar.gz -o lr.tgz
          tar xzf lr.tgz
          cd luarocks-3.13.0
          ./configure --prefix="$GITHUB_WORKSPACE/lr-install" --with-lua="$GITHUB_WORKSPACE/lua-install"
          make
          make install
          echo "$GITHUB_WORKSPACE/lr-install/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/lua-install/bin" >> "$GITHUB_PATH"
      - name: Install LuaRocks 3.13.0 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL https://luarocks.org/releases/luarocks-3.13.0-windows-64.zip -o lr.zip
          unzip -q lr.zip
          echo "$GITHUB_WORKSPACE/luarocks-3.13.0-windows-64" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/lua-install/bin" >> "$GITHUB_PATH"
      - name: Project-local tree, install, pin, reinstall from lock
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          mkdir proj && cd proj
          luarocks --lua-dir "$GITHUB_WORKSPACE/lua-install" --version
          luarocks --lua-dir "$GITHUB_WORKSPACE/lua-install" init --lua-versions=5.5 spk 1.0
          cat > spk-1.0-1.rockspec <<'RS'
          rockspec_format = "3.0"
          package = "spk"
          version = "1.0-1"
          source = { url = "file:///none" }
          description = { summary = "spike", license = "MIT" }
          dependencies = { "lua >= 5.4", "inspect >= 3.1" }
          build = { type = "builtin", modules = { spk = "spk.lua" } }
          RS
          echo 'return require("inspect")' > spk.lua
          cat .luarocks/config-5.5.lua
          LR="luarocks --lua-dir $GITHUB_WORKSPACE/lua-install --tree lua_modules"
          echo "::group::pin"
          $LR build --pin --only-deps spk-1.0-1.rockspec || echo "exit=$?"
          cat luarocks.lock
          echo "::endgroup::"
          rm -rf lua_modules/lib/luarocks lua_modules/share/lua
          echo "::group::reinstall from lock"
          $LR build --only-deps spk-1.0-1.rockspec || echo "exit=$?"
          $LR list --porcelain
          echo "::endgroup::"
          export LUA_PATH="lua_modules/share/lua/5.5/?.lua;;"
          lua -e 'print(require("inspect")({1,2}))'
      - name: C rock (luafilesystem), informative
        continue-on-error: true
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          cd proj
          luarocks --lua-dir "$GITHUB_WORKSPACE/lua-install" --tree lua_modules install luafilesystem
