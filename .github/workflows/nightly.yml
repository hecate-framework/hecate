name: nightly

# Slow checks that do not belong in a pull request (docs/architecture/automation.md): leak detection,
# coverage with its thresholds and long fuzzing. The integration services, the freshness report of the
# pinned dependencies and `check-mirrors` join this workflow with their phases.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  leaks:
    name: leaks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: Add toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/.hecate/toolchain/bin" >> "$GITHUB_PATH"

      - name: Cache rocks
        id: rocks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/rocks
          key: rocks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**', '.github/workflows/ci.yml') }}

      - name: Install luv
        if: steps.rocks.outputs.cache-hit != 'true'
        run: luarocks --tree .hecate/rocks install luv 1.53.0-0

      # The tests of every package need the native modules: `net` (TLS), `json` (decoder and encoder) and
      # `doc` (Markdown), as in ci.yml, and the downloaded test data. The Rust build is cached.
      - name: Cache native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            packages/net/native/target
            packages/json/native/target
            packages/doc/native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/net/native/Cargo.lock', 'packages/net/native/rust-toolchain.toml', 'packages/json/native/Cargo.lock', 'packages/doc/native/Cargo.lock') }}

      - name: Build the native modules
        run: |
          set -e
          for package in net json doc; do
            (cd "packages/$package/native" && rustup toolchain install)
            lua tools/run.lua build-native "$package"
          done

      - name: Download the test data
        run: |
          lua tools/run.lua fetch-fixtures json
          lua tools/run.lua fetch-fixtures doc

      - name: Leak detection
        run: lua tools/run.lua leaks

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: Add toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/.hecate/toolchain/bin" >> "$GITHUB_PATH"

      - name: Cache rocks
        id: rocks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/rocks
          key: rocks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**', '.github/workflows/ci.yml') }}

      - name: Install luv
        if: steps.rocks.outputs.cache-hit != 'true'
        run: luarocks --tree .hecate/rocks install luv 1.53.0-0

      # The tests of every package need the native modules: `net` (TLS), `json` (decoder and encoder) and
      # `doc` (Markdown), as in ci.yml, and the downloaded test data. The Rust build is cached.
      - name: Cache native build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            packages/net/native/target
            packages/json/native/target
            packages/doc/native/target
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/net/native/Cargo.lock', 'packages/net/native/rust-toolchain.toml', 'packages/json/native/Cargo.lock', 'packages/doc/native/Cargo.lock') }}

      - name: Build the native modules
        run: |
          set -e
          for package in net json doc; do
            (cd "packages/$package/native" && rustup toolchain install)
            lua tools/run.lua build-native "$package"
          done

      - name: Download the test data
        run: |
          lua tools/run.lua fetch-fixtures json
          lua tools/run.lua fetch-fixtures doc

      - name: Coverage and thresholds
        run: lua tools/run.lua coverage

      - name: Upload the LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  fuzz:
    name: fuzz (long)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: Add toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/.hecate/toolchain/bin" >> "$GITHUB_PATH"

      - name: Cache cargo-fuzz and the fuzz build
        id: cargo-fuzz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-fuzz
            ~/.cargo/registry
            packages/net/native/fuzz/target
          key: cargo-fuzz-0.12.0-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packages/net/native/fuzz/Cargo.lock', 'packages/net/native/rust-toolchain.toml') }}

      - name: Rust toolchain (nightly) and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version 0.12.0

      - name: Fuzz every target for ten minutes
        env:
          LUA_LIB: ${{ github.workspace }}/.hecate/toolchain/lib
        run: |
          set -e
          lua tools/run.lua fuzz --list | grep -v "^fuzz:" | while read -r package target; do
            echo "::group::$package $target"
            lua tools/run.lua fuzz "$target" --seconds 600
            echo "::endgroup::"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: packages/*/native/fuzz/artifacts/
          if-no-files-found: ignore
