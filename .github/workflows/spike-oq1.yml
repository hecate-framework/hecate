name: spike-oq1
# Temporary: verifies luv against Lua 5.5 on three platforms (OQ-1). Delete with the spike.
on:
  pull_request:
    paths: ['.github/workflows/spike-oq1.yml']
  workflow_dispatch:

jobs:
  luv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Build Lua 5.5.1
        shell: bash
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tgz
          tar xzf lua.tgz
          cat > lua-5.5.1/CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.15)
          project(lua C)
          file(GLOB SRC src/*.c)
          list(REMOVE_ITEM SRC ${CMAKE_SOURCE_DIR}/src/lua.c ${CMAKE_SOURCE_DIR}/src/luac.c)
          add_library(lua5 SHARED ${SRC})
          if(WIN32)
            target_compile_definitions(lua5 PRIVATE LUA_BUILD_AS_DLL)
          else()
            target_compile_definitions(lua5 PRIVATE LUA_USE_POSIX LUA_USE_DLOPEN)
            target_link_libraries(lua5 m ${CMAKE_DL_LIBS})
          endif()
          add_executable(lua src/lua.c)
          target_link_libraries(lua lua5)
          install(TARGETS lua lua5 RUNTIME DESTINATION bin LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)
          install(FILES src/lua.h src/luaconf.h src/lualib.h src/lauxlib.h src/lua.hpp DESTINATION include)
          CM
          cmake -S lua-5.5.1 -B lua-build -DCMAKE_INSTALL_PREFIX="$PWD/lua-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build lua-build --config Release
          cmake --install lua-build --config Release
      - name: Build luv
        shell: bash
        run: |
          git clone --recursive https://github.com/luvit/luv luv
          cmake -S luv -B luv-build -DWITH_LUA_ENGINE=Lua -DLUA_BUILD_TYPE=System \
            -DLUA_INCLUDE_DIR="$PWD/lua-install/include" \
            -DLUA_LIBRARIES="$(ls $PWD/lua-install/lib/*lua5* | head -1)" \
            -DBUILD_MODULE=ON -DBUILD_STATIC_LIBS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build luv-build --config Release
      - name: Run luv tests
        shell: bash
        working-directory: luv
        run: |
          export PATH="$GITHUB_WORKSPACE/lua-install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          so="$(find ../luv-build -name 'luv.so' -o -name 'luv.dll' | head -1)"
          dir="$(cd "$(dirname "$so")" && pwd)"
          if command -v cygpath >/dev/null; then dir="$(cygpath -m "$dir")"; fi
          export LUA_CPATH="$dir/?.so;$dir/?.dll"
          lua tests/run.lua
