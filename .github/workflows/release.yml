name: release

# Builds the `hecate` executable on every platform, packages it (`lua tools/run.lua package-cli`, deterministic archive and
# sha256, smoke-tested), and attaches the archives to a DRAFT release. The workflow never publishes: the owner reviews
# the draft and publishes it by hand (with the "immutable releases" setting, assets cannot be added after publication,
# so every asset is attached here, at creation). Specification: docs/architecture/cli-and-packaging.md, "Releases".
#
# Tags and releases are named `<version>-<revision>` in LuaRocks form, without a `v` prefix (`0.1.0-1`); `X.Y.Z` must
# equal the root `VERSION` file or the `plan` job fails before anything is built. A push of such a tag creates the draft;
# `workflow_dispatch` is the rehearsal: the same build, packaging and smoke test, with the archives kept as workflow
# artifacts and no release created.
#
# Platforms: the three that `ci.yml` builds. aarch64 Linux and Windows runners are to be added to the matrix later (the
# asset names already carry the architecture).

on:
  push:
    tags: ["[0-9]*.[0-9]*.[0-9]*-[0-9]*"]
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision to rehearse, appended to the VERSION file (the archives are named hecate-<VERSION>-<revision>-...)"
        required: false
        default: "1"
        type: string

permissions:
  contents: read

# One release run per tag (or per dispatch ref); a run in progress is never cancelled.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validates the version before building anything: the tag (push) or VERSION plus the revision input (rehearsal).
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: Add toolchain to PATH
        run: echo "$GITHUB_WORKSPACE/.hecate/toolchain/bin" >> "$GITHUB_PATH"

      # `package-cli --check-tag` fails unless the version is X.Y.Z-R with X.Y.Z equal to the VERSION file, and prints it.
      - name: Check the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -eo pipefail
          if [ "$EVENT" = "push" ]; then
            candidate="$TAG"
          else
            candidate="$(tr -d '[:space:]' < VERSION)-${REVISION:-1}"
          fi
          version=$(lua tools/run.lua package-cli "--check-tag=$candidate" | head -n 1)
          echo "release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Attestations are made on a tag push only; the extra permissions are those of `actions/attest-build-provenance`.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      # Release builds from a cold cache: incremental data would only grow the target directories.
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Toolchain steps copied from ci.yml (same pins, same cache key): the executable is the one CI tests.
      - name: Cache toolchain
        id: toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .hecate/toolchain
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/bootstrap/**') }}

      - name: Bootstrap (Linux, macOS)
        if: steps.toolchain.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: tools/bootstrap/bootstrap.sh --prefix .hecate/toolchain

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Bootstrap (Windows)
        if: steps.toolchain.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: tools/bootstrap/bootstrap.ps1

      - name: Add toolchain to PATH
        shell: pwsh
        run: |
          $tc = Join-Path $env:GITHUB_WORKSPACE '.hecate/toolchain'
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $tc 'bin')
          if ($env:RUNNER_OS -eq 'Windows') {
            Add-Content -Path $env:GITHUB_ENV -Value "LUAROCKS_CONFIG=$(Join-Path $tc 'luarocks-config.lua')"
          }

      - name: C toolchain
        if: runner.os != 'Windows'
        run: cc --version | head -1 && cmake --version | head -1

      - name: C toolchain (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: cl 2>&1 | findstr /C:"Version" && cmake --version

      # The JSON encoder is Rust (linked into the executable): the toolchain pinned by its rust-toolchain.toml, which
      # cargo would not pick up from the repository root.
      - name: Rust toolchain
        shell: bash
        run: |
          set -eo pipefail
          (cd packages/json/native && rustup toolchain install)
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' packages/json/native/rust-toolchain.toml)
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          cargo --version

      # --strict (CI implies it): a module that cannot be linked in fails the build.
      - name: Build the executable
        shell: pwsh
        run: lua tools/run.lua build-cli --strict --output=.hecate/release/build/${{ runner.os == 'Windows' && 'hecate.exe' || 'hecate' }}

      - name: Package and smoke-test
        shell: pwsh
        run: lua tools/run.lua package-cli --version=${{ needs.plan.outputs.version }} --exe=.hecate/release/build/${{ runner.os == 'Windows' && 'hecate.exe' || 'hecate' }} --out=.hecate/release/dist

      - name: Attest build provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: .hecate/release/dist/hecate-*.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}

      - name: Upload the archive and its checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hecate-${{ runner.os }}-${{ runner.arch }}
          path: .hecate/release/dist/hecate-*
          if-no-files-found: error
          include-hidden-files: true # the files sit under `.hecate/`, which upload-artifact skips by default
          retention-days: 7

  # Tag push only: creates the DRAFT release with every asset and stops. Publishing is the owner's decision.
  draft-release:
    needs: [plan, build]
    if: github.event_name == 'push'
    name: draft release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      EXPECTED_ARCHIVES: "3" # one per matrix entry of `build`: keep in step with it
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hecate-*
          path: assets
          merge-multiple: true

      - name: Verify the assets
        working-directory: assets
        run: |
          set -eo pipefail
          ls -l
          archives=$(ls hecate-*.tar.gz hecate-*.zip 2>/dev/null | wc -l)
          checksums=$(ls hecate-*.sha256 | wc -l)
          if [ "$archives" != "$EXPECTED_ARCHIVES" ] || [ "$checksums" != "$EXPECTED_ARCHIVES" ]; then
            echo "expected $EXPECTED_ARCHIVES archives and checksums, found $archives and $checksums" >&2
            exit 1
          fi
          sha256sum -c hecate-*.sha256

      - name: Create the draft release
        run: |
          set -eo pipefail
          cat > notes.md <<EOF
          Hecate $TAG: the \`hecate\` executable for Linux, macOS and Windows (archive and sha256 per platform).

          See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md) for the changes.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --notes-file notes.md assets/hecate-*
          echo "Draft release $TAG created: review it, then publish it by hand."
