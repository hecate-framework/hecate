name: security

# Rust dependencies of the native modules (ADR 0021): known vulnerabilities (`cargo audit`) and
# licences, bans and sources (`cargo deny`, policy in `deny.toml`); the tools are built from source at
# a pinned version. CodeQL for the C code, dependency review of pull requests and the OpenSSF Scorecard
# (docs/architecture/automation.md) use third-party actions, pinned by commit hash like every other
# action. CodeQL and Scorecard upload SARIF: code scanning must be enabled for the repository
# (Settings > Code security).
on:
  pull_request:
    paths:
      - "packages/*/csrc/**"
      - "packages/*/native/Cargo.toml"
      - "packages/*/native/Cargo.lock"
      - "packages/*/native/rust-toolchain.toml"
      - "deny.toml"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "packages/*/csrc/**"
      - "packages/*/native/Cargo.toml"
      - "packages/*/native/Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Advisories are published at any time: a weekly run catches one against an unchanged lockfile.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_AUDIT_VERSION: "0.22.2"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  rust-dependencies:
    name: rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The toolchain is pinned by rust-toolchain.toml in the crate directory.
      - name: Rust toolchain
        working-directory: packages/net/native
        run: rustup toolchain install

      - name: Cache the tools
        id: tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-tools-${{ runner.os }}-audit-${{ env.CARGO_AUDIT_VERSION }}-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-audit and cargo-deny
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"

      - name: cargo audit
        working-directory: packages/net/native
        run: cargo audit

      - name: cargo audit (json)
        working-directory: packages/json/native
        run: cargo audit

      - name: cargo audit (doc)
        working-directory: packages/doc/native
        run: cargo audit

      - name: cargo deny
        run: |
          cargo deny --manifest-path packages/net/native/Cargo.toml --config deny.toml check
          cargo deny --manifest-path packages/json/native/Cargo.toml --config deny.toml check
          cargo deny --manifest-path packages/doc/native/Cargo.toml --config deny.toml check

  codeql:
    name: codeql (c)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Build mode `none`: CodeQL extracts the sources of packages/*/csrc without building them.
      - name: Initialise CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:c-cpp"

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review the dependencies of the pull request
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  scorecard:
    name: scorecard
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run the OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      - name: Upload the results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
