name: spike-oq456
# Temporary: builds the OQ-4/5/6 spike modules (llhttp, yyjson, rustls and serde_json through mlua)
# against Lua 5.5.1 on three platforms. Delete with the spike (spike-ci/ too).
on:
  pull_request:
    paths: ['.github/workflows/spike-oq456.yml', 'spike-ci/**']
  workflow_dispatch:

jobs:
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Lua 5.5.1
        shell: bash
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.1.tar.gz -o lua.tgz
          tar xzf lua.tgz
          cat > lua-5.5.1/CMakeLists.txt <<'CM'
          cmake_minimum_required(VERSION 3.15)
          project(lua C)
          file(GLOB SRC src/*.c)
          list(REMOVE_ITEM SRC ${CMAKE_SOURCE_DIR}/src/lua.c ${CMAKE_SOURCE_DIR}/src/luac.c)
          add_library(lua5 SHARED ${SRC})
          if(WIN32)
            target_compile_definitions(lua5 PRIVATE LUA_BUILD_AS_DLL)
            set_target_properties(lua5 PROPERTIES OUTPUT_NAME lua55)
          else()
            target_compile_definitions(lua5 PRIVATE LUA_USE_POSIX LUA_USE_DLOPEN)
            target_link_libraries(lua5 m ${CMAKE_DL_LIBS})
          endif()
          add_executable(lua src/lua.c)
          target_link_libraries(lua lua5)
          install(TARGETS lua lua5 RUNTIME DESTINATION bin LIBRARY DESTINATION lib ARCHIVE DESTINATION lib)
          install(FILES src/lua.h src/luaconf.h src/lualib.h src/lauxlib.h src/lua.hpp DESTINATION include)
          CM
          cmake -S lua-5.5.1 -B lua-build -DCMAKE_INSTALL_PREFIX="$PWD/lua-install" -DCMAKE_BUILD_TYPE=Release
          cmake --build lua-build --config Release
          cmake --install lua-build --config Release
      - name: Fetch llhttp (release branch) and yyjson
        shell: bash
        run: |
          git clone --depth 1 --branch release https://github.com/nodejs/llhttp llhttp
          git clone --depth 1 --branch 0.13.0 https://github.com/ibireme/yyjson yyjson
      - name: Build the C modules
        shell: bash
        run: |
          lib="$(ls $PWD/lua-install/lib/*lua5* | head -1)"
          cmake -S spike-ci -B c-build -DLUA_INCLUDE_DIR="$PWD/lua-install/include" -DLUA_LIBRARIES="$lib" \
            -DLLHTTP_DIR="$PWD/llhttp" -DYYJSON_DIR="$PWD/yyjson" -DCMAKE_BUILD_TYPE=Release
          cmake --build c-build --config Release
          mkdir -p out
          find c-build \( -name 'llhttp_lua.so' -o -name 'llhttp_lua.dll' -o -name 'yy.so' -o -name 'yy.dll' \) -exec cp {} out/ \;
      - name: Build the Rust modules
        shell: bash
        run: |
          rustc --version
          # macOS: Lua symbols are resolved when the module is loaded by the lua executable.
          if [ "$RUNNER_OS" = macOS ]; then export RUSTFLAGS="-C link-arg=-undefined -C link-arg=dynamic_lookup"; fi
          for crate in rust-tls rust-json; do
            cargo build --release --manifest-path spike-ci/$crate/Cargo.toml
          done
          t=spike-ci
          case "$RUNNER_OS" in
            Linux) cp $t/rust-tls/target/release/libhecate_tls.so $t/rust-json/target/release/libhecate_json.so out/ ;;
            macOS) cp $t/rust-tls/target/release/libhecate_tls.dylib out/hecate_tls.so; cp $t/rust-json/target/release/libhecate_json.dylib out/hecate_json.so ;;
            Windows) cp $t/rust-tls/target/release/hecate_tls.dll $t/rust-json/target/release/hecate_json.dll out/ ;;
          esac
          cd out && [ "$RUNNER_OS" = Linux ] && mv libhecate_tls.so hecate_tls.so && mv libhecate_json.so hecate_json.so || true
        env:
          LUA_LIB_NAME: lua55
      - name: Smoke test
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/lua-install/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          export DYLD_LIBRARY_PATH="$GITHUB_WORKSPACE/lua-install/lib"
          ls out
          cd out && lua ../spike-ci/test.lua
