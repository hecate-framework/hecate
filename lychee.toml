# Link checker settings (docs.yml). Internal links only; external links are not checked yet (the
# nightly check is not written, docs/architecture/automation.md).

# The code reference (website/<locale>/reference/<package>/) is generated at build time and is not in
# the checkout, so the pages that link into it cannot be resolved here. `website.yml` builds the site
# with --strict, which checks those links against the generated pages, and `tools/run.lua check-links`
# checks them whenever the reference has been generated. The French pages link to the same paths: they
# exist only as the fallback to the English pages, again at build time.
exclude = [
  '^file://.*/website/(en|fr)/reference/(core|reactor|net|json|log)/',
]
