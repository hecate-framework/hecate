# Link checker settings (docs.yml). Internal links only; external links are not checked yet (the
# nightly check is not written, docs/architecture/automation.md).

# The code reference (website/<tree>/<locale>/reference/<package>/) is generated at build time and is not in
# the checkout, so the pages that link into it cannot be resolved here. `website.yml` builds the site
# with --strict, which checks those links against the generated pages, and `tools/run.lua check-links`
# checks them whenever the reference has been generated. The French pages link to the same paths: they
# exist only as the fallback to the English pages, again at build time.
exclude = [
  '^file://.*/website/(user|maintainer)/(en|fr)/reference/(core|reactor|net|json|log|http|router|schema|openapi|container|config|kernel|test|hecate|unicode|unicode-data|doc)/',
  # Generated by gen-error-codes and gen-config-reference in website.yml, git-ignored.
  '^file://.*/website/(user|maintainer)/(en|fr)/reference/(error-codes|configuration-keys)\.md',
  # Generated by gen-maintainer-docs in website.yml, git-ignored.
  '^file://.*/website/maintainer/en/(architecture|adr)/',
  # Links between the user and the maintainer sites are browser URLs (no .md): `tools/run.lua check-links` resolves them
  # across the two trees (links.cross_tree_target) and the strict build of each site checks its own pages.
  '^file://.*/(user|maintainer)/(en|fr)/[^.]*$',
]
